[project]
name = "placement-agent-swarm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vishal-WD", email = "vishalchandran6126@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.14",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
placement-agent-swarm = "placement_agent_swarm:main"
quality-check = "placement_agent_swarm.quality:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
